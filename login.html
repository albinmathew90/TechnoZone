<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – TechZone</title>
  <link rel="stylesheet" href="style.css" />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>

<body class="auth-page">

  <!-- Simple top nav -->
  <header class="auth-topbar">
    <a href="index.html" class="nav-logo"><i class="fas fa-bolt"></i> TechZone</a>
  </header>

  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <h2>Welcome Back!</h2>
        <p>Sign in to your TechZone account</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)" novalidate>

        <div class="form-group">
          <label for="loginEmail"><i class="fas fa-envelope"></i> Email Address</label>
          <input type="email" id="loginEmail" placeholder="Enter Mail Id" autocomplete="email" />
          <span class="form-error" id="loginEmailError"></span>
        </div>

        <div class="form-group">
          <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
          <div class="password-wrapper">
            <input type="password" id="loginPassword" placeholder="Enter your password"
              autocomplete="current-password" />
            <button type="button" class="toggle-password" onclick="togglePwd('loginPassword', this)">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <span class="form-error" id="loginPasswordError"></span>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" /> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-auth">
          <i class="fas fa-sign-in-alt"></i> Sign In
        </button>

        <div class="auth-divider"><span>OR</span></div>

        <p class="auth-switch">
          Don't have an account? <a href="register.html">Create one here</a>
        </p>
      </form>
    </div>
  <div class="toast" id="toast"></div>
  <script src="script.js"></script>
</body>

</html>
